<title>MedVault – Health Records Vault</title>
<style>

@font-face{font-family:Sora;font-weight:600;font-display:swap;src:url(fonts/sora-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:Manrope;font-weight:400;font-display:swap;src:url(fonts/manrope-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:Manrope;font-weight:500;font-display:swap;src:url(fonts/manrope-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:Manrope;font-weight:600;font-display:swap;src:url(fonts/manrope-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"JetBrains Mono";font-weight:400;font-display:swap;src:url(fonts/jetbrains-mono-latin-400-normal.woff2) format("woff2")}

/* ---- Figma theme tokens ---- */
:root,[data-accent=violet]{--g-d:#a78bfa;--g-l:#6d4fe0;--c-d:#60a5fa;--c-l:#2563eb;--pri:#5b4bd6}
[data-accent=teal]{--g-d:#5eead4;--g-l:#0d9488;--c-d:#22d3ee;--c-l:#0891b2;--pri:#0b857c}
[data-accent=blue]{--g-d:#60a5fa;--g-l:#1d6fe0;--c-d:#67e8f9;--c-l:#0e7490;--pri:#2563eb}
[data-accent=rose]{--g-d:#fb7185;--g-l:#e11d48;--c-d:#fbbf24;--c-l:#d97706;--pri:#be123c}
[data-accent=emerald]{--g-d:#4ade80;--g-l:#16a34a;--c-d:#2dd4bf;--c-l:#0d9488;--pri:#15803d}
[data-accent=amber]{--g-d:#fbbf24;--g-l:#d97706;--c-d:#fb923c;--c-l:#ea580c;--pri:#b45309}
:root,[data-mode=dark]{color-scheme:dark;--bg:#0a0a1f;--panel:#12122e;--ink:#ececff;--mut:#a1a1c7;--line:#2a2a5a;--glow:var(--g-d);--cyan:var(--c-d);--onglow:#0a0a1f;--soft:color-mix(in srgb,var(--g-d) 55%,white);--glass-a:rgba(20,20,48,.65);--glass-b:rgba(12,12,32,.55);--bad:#fb7185;--warn:#fbbf24;--acc:var(--glow)}
[data-mode=light]{color-scheme:light;--bg:#f2f4fb;--panel:#fff;--ink:#12132b;--mut:#5a5d7d;--line:#d6d9ec;--glow:var(--g-l);--cyan:var(--c-l);--onglow:#fff;--soft:var(--g-l);--glass-a:rgba(255,255,255,.78);--glass-b:rgba(255,255,255,.58);--bad:#e11d48;--warn:#d97706;--acc:var(--glow)}
[data-size=sm]{--fs:14px}[data-size=lg]{--fs:18px}
[data-motion=off] *,[data-motion=off] *::before,[data-motion=off] *::after{animation:none!important;transition-duration:0s!important}

*{box-sizing:border-box}
html{font-size:var(--fs,16px);background:var(--bg)}
body{margin:0;min-height:100dvh;font-family:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;font-size:.875rem;transition:background-color .4s,color .4s;scrollbar-width:none;-webkit-tap-highlight-color:transparent}
body::-webkit-scrollbar{display:none}
::selection{background:var(--glow);color:var(--bg)}
.fd,h1,.font-display{font-family:Sora,sans-serif;letter-spacing:-.02em;font-weight:400}
.mono,h2,.lab{font-family:"JetBrains Mono",ui-monospace,monospace}
h1{font-size:1.125rem;line-height:1.25;margin:0}
h2{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--mut);font-weight:400;margin:1.4rem 0 .65rem}
.lab{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--mut)}
.mut{color:var(--mut);font-size:.8rem;line-height:1.5}
.sub{color:var(--mut);font-size:.75rem;margin:0 0 .75rem}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--warn);margin-right:5px;vertical-align:middle}.dot.on{background:var(--glow)}
a{color:var(--glow)}
code{font-family:"JetBrains Mono",monospace;font-size:.75rem;color:var(--glow)}

/* ---- Neural background ---- */
#nb{position:fixed;inset:0;z-index:0;pointer-events:none}
#nb>div,#nb canvas{position:absolute;inset:0}
#nb .v1{background:radial-gradient(ellipse at 70% 10%,color-mix(in srgb,var(--pri) 28%,transparent),transparent 55%),radial-gradient(ellipse at 10% 90%,color-mix(in srgb,var(--cyan) 12%,transparent),transparent 50%)}
#nb .v2{background:radial-gradient(ellipse at center,transparent 40%,var(--bg) 100%)}

/* ---- Layout ---- */
.wrap{position:relative;z-index:10;margin:0 auto;min-height:100dvh;width:100%;max-width:430px;padding:env(safe-area-inset-top,0) 20px 7rem}
header.top{display:flex;align-items:center;justify-content:space-between;padding:1.5rem 0 1.25rem}
.brand{display:flex;align-items:center;gap:.75rem;min-width:0}
.brand .mk{display:grid;place-items:center;width:2.25rem;height:2.25rem;flex:none;border-radius:.75rem;border:1px solid color-mix(in srgb,var(--glow) 50%,transparent);color:var(--glow);background:transparent;padding:0}
.brand .lab{color:var(--glow)}
.brand h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.hb{display:flex;gap:.5rem}
.rb2{position:relative;display:grid;place-items:center;width:2.5rem;height:2.5rem;border-radius:50%;border:1px solid var(--line);color:var(--mut);background:transparent;padding:0}
.rb2 .pip{position:absolute;right:.65rem;top:.65rem;width:6px;height:6px;border-radius:50%;background:var(--glow)}
.i4{width:1rem;height:1rem}.i5{width:1.25rem;height:1.25rem}.i18{width:18px;height:18px}
.rise{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pulse-ring{0%{transform:scale(.6);opacity:.8}100%{transform:scale(2.4);opacity:0}}
@keyframes arc{from{stroke-dashoffset:var(--from)}}
@keyframes sheetup{from{transform:translateY(100%)}}
@keyframes fade{from{opacity:0}}
@keyframes pulse{50%{opacity:.4}}
.pulse{animation:pulse 2s cubic-bezier(.4,0,.6,1) infinite}

.glass,.card{background:linear-gradient(160deg,var(--glass-a),var(--glass-b));-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line)}
.card{border-radius:1rem;padding:1rem;margin-bottom:.75rem}
.r3{border-radius:1.5rem}.r2{border-radius:1rem}
.stack>*+*{margin-top:1.25rem}
.row{display:flex;align-items:center;gap:.75rem}.sp{justify-content:space-between}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem}
.tile{padding:1rem}.tile .k{font-size:.75rem;color:var(--mut)}.tile .v{margin-top:.25rem;font-family:Sora,sans-serif;font-size:1.25rem;letter-spacing:-.02em}.tile .v small{font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--mut)}
.qa{display:flex;flex-direction:column;align-items:center;gap:.5rem;border-radius:1rem;padding:1rem .25rem;font-size:.72rem;color:var(--ink);background:none;border:1px solid var(--line);font-weight:400}
.qa .ci,.ci{display:grid;place-items:center;width:2.5rem;height:2.5rem;border-radius:50%;background:color-mix(in srgb,var(--glow) 10%,transparent);color:var(--glow);flex:none}
.qa{background:linear-gradient(160deg,var(--glass-a),var(--glass-b));-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}

/* ---- Controls ---- */
button,.btn{font:inherit;font-weight:500;background:var(--glow);color:var(--onglow);border:1px solid var(--glow);border-radius:999px;padding:.6rem 1.1rem;cursor:pointer;text-decoration:none;display:inline-block;text-align:center;transition:transform .15s,background .2s,color .2s,border-color .2s}
button:active,.btn:active,.qa:active,.rc:active{transform:scale(.96)}
button.g,.btn.g{background:transparent;color:var(--ink);border-color:var(--line)}
button.d{background:var(--bad);border-color:var(--bad);color:#fff}
button:disabled{opacity:.5;pointer-events:none}
button:focus-visible,.btn:focus-visible,[role=button]:focus-visible,input:focus-visible{outline:2px solid var(--glow);outline-offset:2px}
.wrap button.row-btn{background:none;border:0;color:inherit;font-weight:400}
input,select,textarea{width:100%;padding:.7rem .9rem;border-radius:.9rem;border:1px solid var(--line);background:color-mix(in srgb,var(--panel) 70%,transparent);color:var(--ink);font:inherit;margin-bottom:.5rem;outline:none;transition:border-color .2s}
input:focus,select:focus,textarea:focus{border-color:var(--glow)}
::placeholder{color:var(--mut);opacity:.7}
.chips{display:flex;gap:.5rem;overflow-x:auto;margin:0 -20px .75rem;padding:0 20px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;white-space:nowrap;padding:.5rem 1rem;font-size:.75rem}
.chips button.g{color:var(--mut)}
.tag{display:inline-block;flex:none;font-family:"JetBrains Mono",monospace;font-size:10px;text-transform:uppercase;padding:.15rem .5rem;border-radius:999px;border:1px solid color-mix(in srgb,var(--glow) 40%,transparent);color:var(--glow);background:transparent;font-weight:400}
.tag[style]{color:var(--onglow)!important;border-color:transparent}
.tag.Positive{color:var(--glow)}.tag.Watch{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}.tag.Action{color:var(--cyan);border-color:color-mix(in srgb,var(--cyan) 40%,transparent)}
.sw{position:relative;width:2.75rem;height:1.5rem;border-radius:999px;background:var(--line);cursor:pointer;flex:none;transition:background .2s;border:0;padding:0}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--bg);transition:left .2s}
.sw.on{background:var(--glow)}.sw.on::after{left:22px}
[dir=rtl] .sw::after{left:auto;right:2px}[dir=rtl] .sw.on::after{right:22px}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;padding:.25rem}
.seg button{flex:1;background:transparent;border:0;color:var(--mut);font-size:.75rem;padding:.5rem}
.seg button.on{background:var(--glow);color:var(--onglow)}
.divide>*+*{border-top:1px solid var(--line)}
.li{display:flex;align-items:center;justify-content:space-between;gap:.75rem;padding:1rem;width:100%;text-align:left}
.li .t{font-size:.875rem}.li .s{font-size:.75rem;color:var(--mut)}
.rbtn{display:flex;align-items:center;gap:.75rem;width:100%;border-radius:1.5rem;padding:1rem;text-align:left;color:var(--ink);background:none}

/* ---- Records ---- */
.rc{display:flex;align-items:center;gap:.75rem;border-radius:1rem;padding:1rem;margin-bottom:.75rem;cursor:pointer;transition:transform .15s}
.rb{display:grid;place-items:center;width:2.5rem;height:2.5rem;flex:none;border-radius:.75rem;background:color-mix(in srgb,var(--glow) 10%,transparent);color:var(--glow);font-family:"JetBrains Mono",monospace;font-size:10px;text-transform:uppercase}
.rm{flex:1;min-width:0;display:block}.rt,.rs{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt{font-size:.875rem;font-weight:500}.rs{font-size:.75rem;color:var(--mut)}
.rd{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--mut)}
img.doc{width:100%;border-radius:.9rem;margin:.5rem 0;border:1px solid var(--line)}
.bars{display:flex;height:6rem;align-items:flex-end;gap:.5rem}
.bars>div{flex:1;display:flex;flex-direction:column;align-items:center;gap:.5rem;height:100%;justify-content:flex-end}
.bars i{display:block;width:100%;border-radius:.4rem .4rem 0 0;background:linear-gradient(to top,var(--pri),var(--glow))}
.bars span{font-family:"JetBrains Mono",monospace;font-size:9px;color:var(--mut)}
.hbar{display:flex;align-items:center;gap:.6rem;margin:.4rem 0}.hbar .n{width:7rem;font-size:.72rem;color:var(--mut)}.hbar .tr{flex:1;background:var(--line);border-radius:9px;overflow:hidden}.hbar .tr i{display:block;height:8px;background:linear-gradient(90deg,var(--pri),var(--glow));transition:width .4s}
.av{display:grid;place-items:center;width:3.5rem;height:3.5rem;flex:none;border-radius:50%;background:linear-gradient(135deg,var(--glow),var(--cyan));color:var(--onglow);font-family:Sora,sans-serif;font-size:1.125rem}
.qt .av2{display:grid;place-items:center;width:2.5rem;height:2.5rem;flex:none;border-radius:50%;background:color-mix(in srgb,var(--glow) 12%,transparent);color:var(--glow);font-weight:600;font-size:.75rem}
.datebox{display:grid;place-items:center;width:3.5rem;height:3.5rem;flex:none;border-radius:1rem;background:color-mix(in srgb,var(--pri) 30%,transparent);color:var(--glow);font-family:"JetBrains Mono",monospace;font-size:10px;text-transform:uppercase;line-height:1.1;text-align:center}
.datebox b{font-family:Sora,sans-serif;font-size:1.125rem;font-weight:400}

/* ---- Orb ---- */
.orb{position:relative;margin:0 auto;aspect-ratio:1;width:260px}
.orb svg{position:absolute;inset:0;width:100%;height:100%}
.orb .ring{position:absolute;left:50%;top:50%;width:10rem;height:10rem;margin:-5rem 0 0 -5rem;border-radius:50%;border:1px solid color-mix(in srgb,var(--glow) 60%,transparent);animation:pulse-ring 3.5s ease-out infinite}
.orb .ct{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.orb .n{font-family:Sora,sans-serif;font-size:3rem;letter-spacing:-.02em}
.arc{transition:stroke-dashoffset 1.6s cubic-bezier(.2,.7,.2,1)}

/* ---- Nav ---- */
nav.bt{position:fixed;left:0;right:0;bottom:0;z-index:20;margin:0 auto;max-width:430px;padding:0 1rem max(env(safe-area-inset-bottom),12px)}
nav.bt .in{display:flex;justify-content:space-between;align-items:center;border-radius:999px;padding:.375rem;box-shadow:0 25px 50px -12px rgba(0,0,0,.45)}
nav.bt button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:999px;padding:.5rem 0;font-size:10px;background:transparent;border:0;color:var(--mut);font-weight:400}
nav.bt button.on{background:var(--glow);color:var(--onglow)}
nav.bt button.plus{flex:none;width:3.25rem;height:3.25rem;margin:-1.1rem .25rem 0;justify-content:center;color:var(--onglow);background:linear-gradient(135deg,var(--glow),var(--cyan));box-shadow:0 6px 24px color-mix(in srgb,var(--glow) 50%,transparent)}

/* ---- Sheet ---- */
body.lk{overflow:hidden}
.shw{position:fixed;inset:0;z-index:40}
.shw .bd{position:absolute;inset:0;background:rgba(0,0,0,.5);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.shw .sh{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:430px;max-height:88dvh;overflow-y:auto;border-radius:2rem 2rem 0 0;border-bottom:0;padding:.75rem 20px 2rem;background:var(--panel)!important;scrollbar-width:none}
.shw.in .sh{animation:sheetup .5s cubic-bezier(.2,.7,.2,1)}.shw.in .bd{animation:fade .3s}
.grab{margin:0 auto 1rem;height:4px;width:2.5rem;border-radius:99px;background:var(--line)}
.sh h1{font-size:1.125rem}
.sw-sw{display:grid;grid-template-columns:repeat(6,1fr);gap:.5rem}
.sw-sw button{display:flex;flex-direction:column;align-items:center;gap:.4rem;background:none;border:0;padding:0;color:var(--mut);font-size:10px;font-weight:400}
.sw-sw button span.c{display:grid;place-items:center;width:2.75rem;height:2.75rem;border-radius:50%}
.sw-sw button.on span.c{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--ink)}

/* ---- Lock / splash ---- */
#lock{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center}
#lock .mk{display:grid;place-items:center;width:4rem;height:4rem;border-radius:1.25rem;border:1px solid color-mix(in srgb,var(--glow) 50%,transparent);color:var(--glow);margin-bottom:1rem}
#splash{position:fixed;inset:0;z-index:100;background:#0a0a1f;display:flex;flex-direction:column;gap:1rem;align-items:center;justify-content:center;transition:opacity .6s;color:#a78bfa}
#splash .mk{display:grid;place-items:center;width:5rem;height:5rem;border-radius:1.5rem;border:1px solid rgba(167,139,250,.5);animation:pop .8s ease both}
#splash .lab{color:#a78bfa;font-size:12px}
#splash.out{opacity:0;pointer-events:none}
@keyframes pop{from{opacity:0;transform:scale(.85)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head>

function check(txt){const rows=[],names=[];
 txt.split("\n").map(s=>s.trim()).filter(Boolean).forEach(line=>{const m=line.match(/^([a-z]+)\s*(\d+(?:\.\d+)?)\s*mg\s*(?:x|×)?\s*(\d+|od|bd|tds|qid)?/i);
  if(!m){rows.push([line,"warn","Can't read","Use: name, dose in mg, times per day","-"]);return}
  const n=m[1].toLowerCase(),dose=+m[2],f=m[3]?(FQ[m[3].toLowerCase()]||+m[3]):1,d=DB[n];names.push(n);
  if(!d){rows.push([line,"warn","Unknown drug","Not in the built-in list. Verify with a pharmacist.","-"]);return}
  const tot=dose*f,N=n[0].toUpperCase()+n.slice(1);
  if(tot>d.max){const one=dose>d.max?d.max:dose,k=dose>d.max?1:Math.max(1,Math.floor(d.max/dose));rows.push([line,"bad","Over daily limit",tot+" mg/day exceeds "+d.max+" mg/day",N+" "+one+"mg × "+k+"/day"])}
  else rows.push([line,"ok","Within limit",tot+" of "+d.max+" mg/day",line])});
 IX.forEach(([a,b,w])=>{if(names.includes(a)&&names.includes(b))rows.push([a+" + "+b,"bad","Interaction",w,"Review with the prescriber"])});return rows}

const NB={key:"",col:{g:"167,139,250",c:"96,165,250",n:"221,214,254",boost:1},on:false,moving:true,raf:0};
const toRgb=h=>{h=h.trim().replace("#","");if(h.length===3)h=h.split("").map(x=>x+x).join("");return[0,2,4].map(i=>parseInt(h.slice(i,i+2),16))};
function isDark(){return S.th.mode==="system"?matchMedia("(prefers-color-scheme: dark)").matches:S.th.mode==="dark"}
function theme(){const r=document.documentElement,th=S.th,dk=isDark();
 r.lang=S.lang;r.dir=RTL.includes(S.lang)?"rtl":"ltr";
 r.dataset.mode=dk?"dark":"light";r.dataset.accent=th.accent;r.dataset.size=th.size;r.dataset.motion=th.motion?"on":"off";
 const m=document.querySelector("meta[name=theme-color]");if(m)m.content=dk?"#0a0a1f":"#f2f4fb";
 const k=(dk?"d":"l")+th.accent;if(k!==NB.key){NB.key=k;const cs=getComputedStyle(r),g=toRgb(cs.getPropertyValue("--g-"+(dk?"d":"l"))||"#a78bfa"),c=toRgb(cs.getPropertyValue("--c-"+(dk?"d":"l"))||"#60a5fa");
  NB.col={g:g.join(","),c:c.join(","),n:(dk?g.map(v=>Math.round(v+(255-v)*.55)):g).join(","),boost:dk?1:1.8}}
 NB.moving=th.motion&&!matchMedia("(prefers-reduced-motion: reduce)").matches;
 $("#nb").style.display=th.neural?"":"none";
 if(th.neural&&!NB.on)neuralStart();if(!th.neural&&NB.on){NB.on=false;cancelAnimationFrame(NB.raf)}}
function neuralStart(){NB.on=true;const cv=$("#nb canvas"),ctx=cv.getContext("2d"),dpr=Math.min(devicePixelRatio||1,2),mouse={x:-9999,y:-9999},LINK=150;
 let w=0,h=0,nodes=[],pulses=[],crosses=[];
 const resize=()=>{w=innerWidth;h=innerHeight;cv.width=w*dpr;cv.height=h*dpr;cv.style.width=w+"px";cv.style.height=h+"px";ctx.setTransform(dpr,0,0,dpr,0,0);pulses=[];
  const n=Math.min(110,Math.floor(w*h/14000));crosses=Array.from({length:14},()=>({x:Math.random()*w,y:Math.random()*h,v:.1+Math.random()*.2}));
  nodes=Array.from({length:n},()=>({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.25,vy:(Math.random()-.5)*.25,r:Math.random()*1.6+.8}))};
 if(!NB.bound){NB.bound=1;addEventListener("resize",()=>NB.rs&&NB.rs());addEventListener("pointermove",e=>{mouse.x=e.clientX;mouse.y=e.clientY})}
 NB.rs=resize;resize();
 const tick=()=>{if(!NB.on)return;ctx.clearRect(0,0,w,h);const mv=NB.moving,{g:G,c:C,n:N,boost:B}=NB.col;
  if(mv)for(const n of nodes){n.x+=n.vx;n.y+=n.vy;if(n.x<0||n.x>w)n.vx*=-1;if(n.y<0||n.y>h)n.vy*=-1;const dx=n.x-mouse.x,dy=n.y-mouse.y,d=Math.hypot(dx,dy);if(d<120&&d>0){n.x+=dx/d*.6;n.y+=dy/d*.6}}
  const edges=[];
  for(let i=0;i<nodes.length;i++){for(let j=i+1;j<nodes.length;j++){const d=Math.hypot(nodes[i].x-nodes[j].x,nodes[i].y-nodes[j].y);if(d<LINK){edges.push([i,j]);ctx.strokeStyle=`rgba(${G},${(1-d/LINK)*.22*B})`;ctx.lineWidth=.7;ctx.beginPath();ctx.moveTo(nodes[i].x,nodes[i].y);ctx.lineTo(nodes[j].x,nodes[j].y);ctx.stroke()}}
   const dm=Math.hypot(nodes[i].x-mouse.x,nodes[i].y-mouse.y);if(dm<200){ctx.strokeStyle=`rgba(${C},${(1-dm/200)*.55})`;ctx.beginPath();ctx.moveTo(nodes[i].x,nodes[i].y);ctx.lineTo(mouse.x,mouse.y);ctx.stroke()}}
  if(mv&&edges.length&&Math.random()<.08&&pulses.length<14){const [a,b]=edges[Math.floor(Math.random()*edges.length)];pulses.push({a,b,t:0,s:.015+Math.random()*.02})}
  for(let k=pulses.length-1;k>=0;k--){const p=pulses[k];if(mv)p.t+=p.s;if(p.t>=1){pulses.splice(k,1);continue}const A=nodes[p.a],Bn=nodes[p.b];if(!A||!Bn){pulses.splice(k,1);continue}
   const x=A.x+(Bn.x-A.x)*p.t,y=A.y+(Bn.y-A.y)*p.t,g=ctx.createRadialGradient(x,y,0,x,y,12);g.addColorStop(0,`rgba(${G},.95)`);g.addColorStop(1,`rgba(${G},0)`);ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,12,0,7);ctx.fill()}
  ctx.strokeStyle=`rgba(${G},${.18*B})`;ctx.lineWidth=1;
  for(const c of crosses){if(mv){c.y-=c.v;if(c.y<-20)c.y=h+20}const k=5;ctx.beginPath();ctx.moveTo(c.x-k,c.y);ctx.lineTo(c.x+k,c.y);ctx.moveTo(c.x,c.y-k);ctx.lineTo(c.x,c.y+k);ctx.stroke()}
  for(const n of nodes){ctx.fillStyle=`rgba(${N},.75)`;ctx.beginPath();ctx.arc(n.x,n.y,n.r,0,7);ctx.fill()}
  NB.raf=requestAnimationFrame(tick)};tick()}

function vault(){const p=person(),rs=recs(),it=[[10,!!p.blood],[10,!!p.allergies],[10,!!p.emerg],[15,rs.length>0],[10,rs.length>=5],[10,S.docs.length>0],[15,!!S.pin],[10,Date.now()-S.lastBackup<30*864e5],[10,S.rem.length>0||S.places.length>0]];return it.reduce((a,[w,ok])=>a+(ok?w:0),0)}
function finds(){const o=[],p=person(),rs=recs(),now=Date.now();
 rs.filter(r=>r.meds).forEach(r=>{const bad=check(r.meds).filter(x=>x[1]==="bad");if(bad.length)o.push({t:"Review: "+r.title,d:bad[0][0]+": "+bad[0][3]+". Confirm with your doctor or pharmacist.",tag:"Action"})});
 if(rs.some(r=>r.meds)&&!o.length)o.push({t:"Prescriptions within limits",d:"The built-in checker found no over-limit doses or known interactions. It knows only a few medicines, so still confirm with a pharmacist.",tag:"Positive"});
 if(rs.length&&now-S.lastBackup>30*864e5)o.push({t:"Back up your vault",d:"Your records live only on this device. Download a backup from Profile so they can't be lost.",tag:"Action"});
 if(!S.pin)o.push({t:"No PIN lock set",d:"Anyone who opens this device can see your records. Set a 4–6 digit PIN in Profile.",tag:"Watch"});

 if(miss.length)o.push({t:"Emergency card incomplete",d:"Add "+miss.join(", ")+" in Profile so responders have what they need.",tag:"Watch"});
 const last=rs.map(r=>r.date).sort().pop();if(last&&now-new Date(last+"T00:00")>180*864e5)o.push({t:"No recent records",d:"Your latest record is over six months old. Add new reports and prescriptions to keep the vault current.",tag:"Watch"});
 const ym=new Date().toISOString().slice(0,7),mc=rs.filter(r=>(r.date||"").startsWith(ym)).length;if(mc)o.push({t:mc+" record"+(mc>1?"s":"")+" added this month",d:"Keeping reports in one place makes visits and follow-ups easier.",tag:"Positive"});
 if(!o.length)o.push({t:"Vault looks good",d:"Add your first record to start building insights.",tag:"Positive"});return o}

function ins(){const rs=recs(),now=new Date(),ms=[];for(let i=5;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);ms.push({k:d.toISOString().slice(0,7).replace(/^(\d{4})-(\d\d)$/,"$1-$2"),l:d.toLocaleString(undefined,{month:"narrow"})})}
 const key=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;ms.forEach((m,i)=>{const d=new Date(now.getFullYear(),now.getMonth()-(5-i),1);m.k=key(d);m.v=rs.filter(r=>(r.date||"").startsWith(m.k)).length});
 const mx=Math.max(1,...ms.map(m=>m.v)),dl=ms[5].v-ms[4].v,f=finds(),c={};rs.forEach(r=>c[r.tag]=(c[r.tag]||0)+1);const e=Object.entries(c),cm=Math.max(1,...Object.values(c));
 return head("Insights",esc(person().n)+"'s vault")+`<div class="stack"><div class="glass r3" style="padding:1.25rem"><div class="row sp" style="margin-bottom:1rem"><div class="lab">Records added · 6 months</div><span class="mono" style="font-size:.75rem;color:var(--glow)">${dl>0?"+":""}${dl}</span></div>
 <div class="bars">${ms.map((m,i)=>`<div><i style="height:${Math.max(6,m.v/mx*100)}%;opacity:${i===5?1:.5}" title="${m.v}"></i><span>${m.l}</span></div>`).join("")}</div></div>
 <div class="lab" style="color:var(--glow);display:flex;align-items:center;gap:.5rem"><span class="pulse" style="width:6px;height:6px;border-radius:50%;background:var(--glow)"></span>Neural analysis · ${f.length} finding${f.length>1?"s":""}</div>
 ${f.map(x=>`<div class="glass r2" style="padding:1rem"><div class="row sp" style="align-items:flex-start"><div style="font-size:.875rem;font-weight:500">${esc(x.t)}</div><span class="tag ${x.tag}">${x.tag}</span></div><p class="mut" style="margin:.5rem 0 0">${esc(x.d)}</p></div>`).join("")}
 ${e.length?`<div class="glass r3" style="padding:1.25rem"><div class="lab" style="margin-bottom:.5rem">By record type</div>${e.map(([k,v])=>`<div class="hbar"><span class="n">${esc(k)}</span><div class="tr"><i style="width:${v/cm*100}%"></i></div><b style="width:1.25rem;text-align:right">${v}</b></div>`).join("")}</div>`:""}</div>`}

/* ---- Doctors ---- */
function prov(){return head("Doctors","Manage who can see your records")+S.docs.map((d,i)=>`<div class="card"><div class="row sp"><div><b>${esc(d.n)}</b><div class="mut">${esc(d.sp)} · ${Object.values(d.shared).filter(Boolean).length} records shared</div></div><button class="g" aria-label="Remove ${esc(d.n)}" onclick="set(()=>S.docs.splice(${i},1))">✕</button></div></div>`).join("")+
 `<div class="card"><input id="dn" placeholder="Doctor / clinic name"><input id="ds" placeholder="Specialty"><button style="width:100%" onclick="addDoc()">Add provider</button></div>`}
function addDoc(){const n=$("#dn").value.trim();if(n)set(()=>S.docs.push({n,sp:$("#ds").value||"—",shared:{}}))}

/* ---- Profile ---- */
function prof(){const p=person(),ini=(p.n||"?").split(/\s+/).map(w=>w[0]).join("").slice(0,2).toUpperCase(),nr=recs().length;
 const f=(k,ph)=>`<input value="${esc(p[k]||"")}" placeholder="${ph}" onchange="person().${k}=this.value;save();render()">`;
 return head("Profile","Basic health info")+`<div class="stack"><div class="glass r3" style="padding:1.25rem"><div class="row" style="gap:1rem"><div class="av">${esc(ini)}</div><div><div class="fd" style="font-size:1.125rem">${esc(p.n)}</div><div class="mono mut" style="font-size:11px">${nr} record${nr===1?"":"s"}${p.rel?" · "+esc(p.rel):""}</div></div></div>
 <div class="grid" style="grid-template-columns:repeat(3,1fr);gap:.5rem;margin-top:1rem;text-align:center">${[[p.blood,"Blood"],[p.allergies,"Allergy"],[p.emerg,"Emergency"]].map(([v,l])=>`<div style="border:1px solid var(--line);border-radius:.75rem;padding:.6rem .25rem;min-width:0"><div style="font-size:.8rem;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${v?esc(v):"—"}</div><div class="mono mut" style="font-size:9px;text-transform:uppercase">${l}</div></div>`).join("")}</div></div>
 <div class="card" style="margin:0"><div class="lab" style="margin-bottom:.6rem">Details</div><input value="${esc(p.n)}" placeholder="Name" onchange="person().n=this.value;save();render()">${S.fam?f("rel","Relation to you"):""}${f("blood","Blood type")}${f("allergies","Allergies")}${f("emerg","Emergency contact (name and phone)")}</div>
 <div class="glass r3 divide">
  <button class="li row-btn" onclick="set(()=>S.sheet='theme')"><span class="row"><span class="ci">${Ic("sliders")}</span><span><span class="t" style="display:block">Customise theme</span><span class="s" style="display:block">Dark mode, accent colour, text size</span></span></span>${Ic("chev","i4")}</button>
  <button class="li row-btn" onclick="go('prov')"><span class="row"><span class="ci">${Ic("steth")}</span><span><span class="t" style="display:block">Doctors &amp; sharing</span><span class="s" style="display:block">${S.docs.length} provider${S.docs.length===1?"":"s"}</span></span></span>${Ic("chev","i4")}</button>
  <button class="li row-btn" onclick="go('tools')"><span class="row"><span class="ci">${Ic("tools")}</span><span><span class="t" style="display:block">Tools</span><span class="s" style="display:block">Prescription check, branches, nearby</span></span></span>${Ic("chev","i4")}</button>
  <button class="li row-btn" onclick="go('about')"><span class="row"><span class="ci">ℹ️</span><span><span class="t" style="display:block">About, privacy &amp; feedback</span><span class="s" style="display:block">Version ${VER}</span></span></span>${Ic("chev","i4")}</button></div>
 <div><h2 style="margin-top:0">🌐 ${t("lang")}</h2><div class="card"><select style="margin:0" onchange="set(()=>S.lang=this.value)">${Object.entries(LN).sort((a,b)=>a[1].localeCompare(b[1])).map(([k,v])=>`<option value="${k}" ${S.lang===k?"selected":""}>${v}</option>`).join("")}</select></div></div>
 <div><h2 style="margin-top:0">Security</h2><div class="card"><input id="np" type="password" inputmode="numeric" maxlength="6" placeholder="${S.pin?"Change":"Set"} PIN lock (4-6 digits)"><div class="row"><button onclick="setPin()">Save PIN</button>${S.pin?`<button class="g" onclick="set(()=>S.pin='')">Remove</button>`:""}</div></div></div>
 ${cloudCard()}
 <div><h2 style="margin-top:0">Backup</h2><div class="card"><p class="mut" style="margin-top:0">Everything is stored on this device. Back up to a file you control.${S.lastBackup?" Last backup: "+new Date(S.lastBackup).toLocaleDateString()+".":""}</p><div class="row"><button onclick="backup()">Download backup</button><label class="btn g">Restore<input type="file" accept=".json" hidden onchange="restore(this)"></label></div></div></div>
 <div><h2 style="margin-top:0">Activity</h2>${S.hist.slice(0,15).map(h=>`<div class="card mut" style="padding:.75rem 1rem">${esc(h.m)}<br><span class="mono" style="font-size:10px">${esc(h.t)}</span></div>`).join("")||'<p class="mut">No activity yet.</p>'}</div>
 <p class="mono mut" style="text-align:center;font-size:10px;text-transform:uppercase;letter-spacing:.1em;margin:0">${CD.a?"Cloud sync on":"Stored on this device only"} · Not medical advice</p>
 <button class="d" style="width:100%" onclick="if(confirm('Erase all data on this device?')){localStorage.removeItem('medvault');location.reload()}">Erase all data</button></div>`}
function setPin(){const v=$("#np").value;if(/^\d{4,6}$/.test(v))set(()=>{S.pin=v;S.unlocked=true;log("PIN lock set")});else{$("#np").value="";$("#np").placeholder="Use 4 to 6 digits"}}
function backup(){const b=new Blob([JSON.stringify(S)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="medvault-backup.json";a.click();S.lastBackup=Date.now();save();render()}
function restore(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);S={...S,...x,th:{...DTH,...(x.th||{})},tab:"home",sheet:null,open:null};save();render()}catch(e){alert("Invalid file")}};r.readAsText(f)}
function tryPin(){if($("#pin").value===S.pin){S.unlocked=true;render()}else{$("#pin").value="";$("#pin").placeholder="Wrong PIN"}}
function addRem(){const x=$("#rt").value.trim();if(x)set(()=>S.rem.push({t:x,d:$("#rd").value.replace("T"," ")}))}
function saveVitals(){const v={hr:$("#v_hr").value.trim(),spo2:$("#v_spo2").value.trim(),bp:$("#v_bp").value.trim(),temp:$("#v_temp").value.trim(),wt:$("#v_wt").value.trim(),at:Date.now()};set(()=>{person().vitals=v;log("Logged vitals");S.sheet=null})}
const setTh=(k,v)=>set(()=>S.th[k]=v);

/* ---- Sheets ---- */
function sheetHtml(){const s=S.sheet;if(!s)return"";let title="",body="",done="Done";
 if(s==="theme"){title="Customise theme";const th=S.th,seg=(k,o)=>`<div class="seg">${o.map(([v,l])=>`<button class="${th[k]===v?"on":""}" aria-pressed="${th[k]===v}" onclick="setTh('${k}','${v}')">${l}</button>`).join("")}</div>`,tg=(k,l,sb)=>`<div class="li" style="padding:.75rem 0"><div><div class="t">${l}</div><div class="s">${sb}</div></div><button class="sw ${th[k]?"on":""}" role="switch" aria-checked="${th[k]}" aria-label="${l}" onclick="setTh('${k}',${!th[k]})"></button></div>`;
  body=`<h2>Appearance</h2>${seg("mode",[["dark","Dark"],["light","Light"],["system","System"]])}<h2>Accent colour</h2><div class="sw-sw">${ACC.map(([k,l,c])=>`<button class="${th.accent===k?"on":""}" aria-label="${l}" aria-pressed="${th.accent===k}" onclick="setTh('accent','${k}')"><span class="c" style="background:${c}">${th.accent===k?'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#0a0a1f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>':""}</span>${l}</button>`).join("")}</div><h2>Text size</h2>${seg("size",[["sm","Compact"],["md","Default"],["lg","Large"]])}<h2>Effects</h2><div class="divide">${tg("neural","Neural background","Animated neurons and synapses")}${tg("motion","Motion","Animations and live pulses")}</div><button class="g" style="width:100%;margin-top:1.5rem;color:var(--mut)" onclick="set(()=>S.th={...DTH})">Reset to default</button>`}
 else if(s==="rem"){title="Reminders";body=S.rem.map((x,i)=>`<div class="card row sp"><span>⏰ ${esc(x.t)} <span class="mut">${esc(x.d)}</span></span><button class="g" aria-label="Delete reminder" onclick="set(()=>S.rem.splice(${i},1))">✕</button></div>`).join("")||'<p class="mut">No reminders yet.</p>';body+=`<div class="card"><input id="rt" placeholder="Pill or follow-up..."><input id="rd" type="datetime-local"><button style="width:100%" onclick="addRem()">Add reminder</button></div><p class="mut">Reminders are notes inside the app. They don't send phone notifications.</p>`}
 else if(s==="vitals"){title="Log vitals";const v=person().vitals||{};body=`<p class="mut" style="margin-top:0">Enter what you measured. Values are saved on this device for ${esc(person().n)}.</p>${[["hr","Heart rate (bpm)","numeric"],["spo2","SpO₂ (%)","numeric"],["bp","Blood pressure (e.g. 118/76)","text"],["temp","Temperature (°C)","decimal"],["wt","Weight (kg)","decimal"]].map(([k,p,m])=>`<input id="v_${k}" inputmode="${m}" placeholder="${p}" value="${esc(v[k]||"")}">`).join("")}<button style="width:100%" onclick="saveVitals()">Save</button>${v.at?`<p class="mut">Last logged ${new Date(v.at).toLocaleString()}</p>`:""}`}
 else if(s==="emerg"){title="Emergency card";const p=person(),ph=String(p.emerg||"").replace(/[^\d+]/g,"");done="Close";body=`<div class="card"><div class="lab">Name</div><div style="font-size:1.1rem;margin-bottom:.75rem">${esc(p.n)}</div><div class="lab">Blood type</div><div style="font-size:1.1rem;margin-bottom:.75rem">${p.blood?esc(p.blood):'<span class="mut">Not set</span>'}</div><div class="lab">Allergies</div><div style="font-size:1.1rem;margin-bottom:.75rem">${p.allergies?esc(p.allergies):'<span class="mut">Not set</span>'}</div><div class="lab">Emergency contact</div><div style="font-size:1.1rem">${p.emerg?esc(p.emerg):'<span class="mut">Not set</span>'}</div></div>
  <div class="row" style="flex-wrap:wrap">${ph.length>=5?`<a class="btn" href="tel:${esc(ph)}">Call contact</a>`:""}<button class="g" onclick="set(()=>{S.sheet=null;S.prev=S.tab;S.tab='tools';S.tl='near'});findNear()">📍 Nearest hospital</button>${p.blood&&p.allergies&&p.emerg?"":`<button class="g" onclick="go('prof')">Complete profile</button>`}</div><p class="mut" style="margin-top:1rem">In an emergency, call your local emergency number first.</p>`}
 else if(s==="wn"){title="What's new in "+VER;done="Got it";body=clHtml([CL[0]])+`<button class="g" style="width:100%" onclick="set(()=>{S.seen=VER;S.sheet=null;S.prev=S.tab;S.tab='about'})">See all updates</button>`}
 else if(s==="detail"){const r=S.records[S.open];if(!r)return"";title=esc(r.title);body=detailBody();done="Back"}
 return`<div class="shw ${window.SHK!==s?"in":""}"><div class="bd" onclick="closeSheet()"></div><div class="sh glass" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="grab"></div><div class="row sp" style="margin-bottom:.25rem"><h1 style="min-width:0">${title}</h1><button class="g" style="padding:.4rem 1rem;font-size:.75rem" onclick="closeSheet()">${done}</button></div>${body}</div></div>`}
function closeSheet(){set(()=>{if(S.sheet==="wn")S.seen=VER;S.sheet=null;S.open=null})}

/* ---- Render ---- */
const TT=()=>({home:t("hello")+", "+esc(person().n),rec:t("rec"),add:"Add record",ins:"Insights",prof:t("prof"),tools:TL[S.lang]||"Tools",prov:t("prov"),about:"About"});
const BACKT=["tools","prov","about"],NAVON={tools:"home",prov:"prof",about:"prof"};
const IL={en:"Insights",bn:"ইনসাইট",hi:"इनसाइट",ar:"رؤى",ur:"بصیرت",es:"Análisis",fr:"Analyses",de:"Einblicke",pt:"Análises",ru:"Анализ",tr:"Öngörüler",id:"Wawasan",zh:"洞察",ja:"インサイト"};
function render(){theme();const A=$("#app");document.body.classList.toggle("lk",!!S.sheet);
 if(S.pin&&!S.unlocked){A.innerHTML=`<div id="lock"><div class="mk">${Cross("i5")}</div><div class="lab" style="color:var(--glow)">MedVault</div><h1 style="margin:.25rem 0 .5rem">Enter your PIN</h1><input id="pin" type="password" inputmode="numeric" maxlength="6" aria-label="PIN" style="max-width:200px;text-align:center" onkeydown="if(event.key==='Enter')tryPin()"><button onclick="tryPin()">Unlock</button></div>`;return}
 const fx=S.tab!==window.LK;window.LK=S.tab;if(fx)scrollTo(0,0);
 const on=NAVON[S.tab]||S.tab,back=BACKT.includes(S.tab),nav=[["home","home",t("home")],["rec","file",t("rec")],["add","plus","Add record"],["ins","spark",IL[S.lang]||IL.en],["prof","user",t("prof")]];
 const shk=S.sheet||"",sh=sheetHtml();window.SHK=shk;
 A.innerHTML=`<div class="wrap"><header class="top"><div class="brand">${back?`<button class="mk" aria-label="Back" onclick="go(S.prev&&S.prev!==S.tab?S.prev:'home')">${Ic("back","i4")}</button>`:`<span class="mk">${Cross("i4")}</span>`}<div style="min-width:0"><div class="lab">MedVault</div><h1 class="${fx?"rise":""}">${TT()[S.tab]}</h1></div></div>
 <div class="hb"><button class="rb2" aria-label="Customise theme" onclick="set(()=>S.sheet='theme')">${Ic("sliders","i4")}</button><button class="rb2" aria-label="Reminders" onclick="set(()=>S.sheet='rem')">${Ic("bell","i4")}${S.rem.length?'<span class="pip"></span>':""}</button></div></header>
 <main class="${fx?"rise":""}">${({home,rec,add,ins,prof,tools,prov,about})[S.tab]()}</main></div>
 <nav class="bt"><div class="in glass">${nav.map(([k,i,l])=>`<button class="${on===k?"on":""} ${k==="add"?"plus":""}" aria-label="${l}" ${on===k?'aria-current="page"':""} onclick="go('${k}')">${Ic(i,k==="add"?"i5":"i18")}${k==="add"?"":l}</button>`).join("")}</div></nav>${sh}`}

/* ---- boot ---- */
addEventListener("online",()=>{render();cloudSync()});addEventListener("offline",render);
matchMedia("(prefers-color-scheme: dark)").addEventListener&&matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{if(S.th.mode==="system")render()});
try{navigator.serviceWorker&&navigator.serviceWorker.register("sw.js")}catch(e){}
if(!S.seen)S.seen=S.records.length?"1.0.0":VER;if(S.seen!==VER)S.sheet="wn";save(1);
setTimeout(()=>$("#splash").classList.add("out"),1300);setTimeout(()=>{const s=$("#splash");s&&s.remove()},2000);
render();cloudSync();

</script></body></html>
